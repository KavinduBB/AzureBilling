name: Deploy

# Order (ADR-026):
#   build and push images → what-if → [approval] → deploy infra (new web revision at 0%)
#   → migrate job → smoke test the new revision → move traffic → update worker
#   → deactivate old revisions.
# Runbook, required variables and permissions: infra/deploy.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options: [test, prod]
      region:
        description: Regional stack
        required: true
        default: eu
        type: choice
        options: [eu, us]

# OIDC federated credentials, not a stored secret. The workflow gets a short-lived Entra token for
# this repository and environment only, so there is no long-lived Azure credential to leak.
permissions:
  id-token: write
  contents: read

concurrency:
  # One deployment at a time per environment and region. Overlapping runs would race on
  # migrations and traffic.
  group: deploy-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

env:
  NAME_PREFIX: mlcp
  AZURE_BICEP_CHECK_VERSION: "false"

jobs:
  guard:
    name: Only from main
    runs-on: ubuntu-latest
    steps:
      - name: Refuse other refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deployments run only from refs/heads/main (got ${{ github.ref }})."
          exit 1

  build-images:
    name: Build and push images
    needs: guard
    runs-on: ubuntu-latest
    # Unprotected environment holding the same variables as the protected one. Its federated
    # credential is limited to AcrPush and read-only what-if (infra/deploy.md).
    environment: ${{ inputs.environment }}-plan
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Registry login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/Mlcp.Web/Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/mlcp-web:${{ steps.meta.outputs.tag }}

      - name: Build and push sync worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/Mlcp.Sync/Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/mlcp-sync:${{ steps.meta.outputs.tag }}

      - name: Build and push migration bundle
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/Mlcp.Persistence/Dockerfile.migrate
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/mlcp-migrate:${{ steps.meta.outputs.tag }}

  what-if:
    name: What-if
    needs: build-images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment parameters
        id: params
        env:
          TAG: ${{ needs.build-images.outputs.tag }}
          REGION: ${{ inputs.region }}
          ENVIRONMENT: ${{ inputs.environment }}
          RESOURCE_GROUP: ${{ inputs.region == 'eu' && vars.RESOURCE_GROUP_EU || vars.RESOURCE_GROUP_US }}
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: .github/scripts/resolve-deploy-params.sh

      - name: What-if
        # Printed before the approval gate, so the reviewer sees what the deployment is about to
        # change instead of reading it afterwards in the activity log.
        env:
          MLCP_ENVIRONMENT: ${{ inputs.environment }}
          MLCP_ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          MLCP_USAGE_INSIGHTS_CLIENT_ID: ${{ vars.USAGE_INSIGHTS_CLIENT_ID }}
          MLCP_SQL_ADMIN_GROUP_OBJECT_ID: ${{ vars.SQL_ADMIN_GROUP_OBJECT_ID }}
          MLCP_SQL_ADMIN_GROUP_NAME: ${{ vars.SQL_ADMIN_GROUP_NAME }}
          MLCP_ACR_NAME: ${{ vars.ACR_NAME }}
          MLCP_ACR_RESOURCE_GROUP: ${{ vars.ACR_RESOURCE_GROUP }}
          MLCP_PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
          MLCP_REGION_DIRECTORY_TABLE_URI: ${{ vars.REGION_DIRECTORY_TABLE_URI }}
          MLCP_REGION_DIRECTORY_STORAGE_ACCOUNT_ID: ${{ vars.REGION_DIRECTORY_STORAGE_ACCOUNT_ID }}
          MLCP_CUSTOMER_RBAC_TEMPLATE_URL: ${{ vars.CUSTOMER_RBAC_TEMPLATE_URL }}
          MLCP_EMAIL_ENDPOINT: ${{ vars.EMAIL_ENDPOINT }}
          MLCP_EMAIL_SENDER_ADDRESS: ${{ vars.EMAIL_SENDER_ADDRESS }}
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${{ steps.params.outputs.resource_group }}" \
            --parameters "infra/main.${{ inputs.region }}.bicepparam"

  release:
    name: Deploy, migrate, verify, move traffic
    needs: [build-images, what-if]
    runs-on: ubuntu-latest
    # Protected environment: required reviewers approve after reading the what-if output.
    environment: ${{ inputs.environment }}
    timeout-minutes: 90

    env:
      MLCP_ENVIRONMENT: ${{ inputs.environment }}
      MLCP_ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      MLCP_USAGE_INSIGHTS_CLIENT_ID: ${{ vars.USAGE_INSIGHTS_CLIENT_ID }}
      MLCP_SQL_ADMIN_GROUP_OBJECT_ID: ${{ vars.SQL_ADMIN_GROUP_OBJECT_ID }}
      MLCP_SQL_ADMIN_GROUP_NAME: ${{ vars.SQL_ADMIN_GROUP_NAME }}
      MLCP_ACR_NAME: ${{ vars.ACR_NAME }}
      MLCP_ACR_RESOURCE_GROUP: ${{ vars.ACR_RESOURCE_GROUP }}
      MLCP_PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
      MLCP_REGION_DIRECTORY_TABLE_URI: ${{ vars.REGION_DIRECTORY_TABLE_URI }}
      MLCP_REGION_DIRECTORY_STORAGE_ACCOUNT_ID: ${{ vars.REGION_DIRECTORY_STORAGE_ACCOUNT_ID }}
      MLCP_CUSTOMER_RBAC_TEMPLATE_URL: ${{ vars.CUSTOMER_RBAC_TEMPLATE_URL }}
      MLCP_EMAIL_ENDPOINT: ${{ vars.EMAIL_ENDPOINT }}
      MLCP_EMAIL_SENDER_ADDRESS: ${{ vars.EMAIL_SENDER_ADDRESS }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment parameters
        # Re-resolved after approval: the stable revision may have changed while waiting.
        id: params
        env:
          TAG: ${{ needs.build-images.outputs.tag }}
          REGION: ${{ inputs.region }}
          ENVIRONMENT: ${{ inputs.environment }}
          RESOURCE_GROUP: ${{ inputs.region == 'eu' && vars.RESOURCE_GROUP_EU || vars.RESOURCE_GROUP_US }}
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: .github/scripts/resolve-deploy-params.sh

      - name: 1. Deploy infrastructure (new web revision at 0% traffic)
        id: deploy
        run: |
          set -euo pipefail
          outputs=$(az deployment group create \
            --resource-group "${{ steps.params.outputs.resource_group }}" \
            --name "mlcp-${{ inputs.region }}-${{ github.run_number }}" \
            --parameters "infra/main.${{ inputs.region }}.bicepparam" \
            --query properties.outputs -o json)
          echo "migrate_job=$(jq -r .migrateJobName.value <<<"$outputs")" >> "$GITHUB_OUTPUT"

      - name: 2. Run migrations (inside the VNet, as the migrator identity)
        run: >
          .github/scripts/run-job.sh
          "${{ steps.params.outputs.resource_group }}"
          "${{ steps.deploy.outputs.migrate_job }}"

      - name: 3. Smoke-test the new revision
        run: |
          set -euo pipefail
          fqdn=$(az containerapp revision show \
            -g "${{ steps.params.outputs.resource_group }}" \
            -n "${{ steps.params.outputs.web_app }}" \
            --revision "${{ steps.params.outputs.candidate_revision }}" \
            --query properties.fqdn -o tsv)
          echo "Candidate revision FQDN: $fqdn"
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 10 "https://$fqdn/health/ready" > /dev/null; then
              echo "Ready after $attempt attempt(s)."
              exit 0
            fi
            echo "Not ready yet (attempt $attempt)."
            sleep 15
          done
          echo "::error::The new revision did not become ready. Traffic was not moved."
          exit 1

      - name: 4. Move all traffic to the new revision
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            -g "${{ steps.params.outputs.resource_group }}" \
            -n "${{ steps.params.outputs.web_app }}" \
            --revision-weight "${{ steps.params.outputs.candidate_revision }}=100" \
            -o none

      - name: 5. Update the worker to the new image (after migrations)
        run: |
          set -euo pipefail
          az containerapp update \
            -g "${{ steps.params.outputs.resource_group }}" \
            -n "${{ steps.params.outputs.sync_app }}" \
            --image "${{ steps.params.outputs.new_sync_image }}" \
            -o none

      - name: 6. Deactivate old web revisions
        run: |
          set -euo pipefail
          rg="${{ steps.params.outputs.resource_group }}"
          app="${{ steps.params.outputs.web_app }}"
          keep="${{ steps.params.outputs.candidate_revision }}"
          az containerapp revision list -g "$rg" -n "$app" \
            --query "[?properties.active].name" -o tsv |
          while read -r rev; do
            if [ -n "$rev" ] && [ "$rev" != "$keep" ]; then
              echo "Deactivating $rev"
              az containerapp revision deactivate -g "$rg" -n "$app" --revision "$rev" -o none
            fi
          done
