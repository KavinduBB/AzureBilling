# Local development dependencies for MLCP.
#
#   docker compose up -d
#
# Nothing here is production shaped. In Azure these are Azure SQL, Azure Cache for Redis,
# Azure Service Bus and Storage, all reached over Private Endpoints with Managed Identity
# (docs/03-architecture.md §8). The passwords below are local-only and are meant to be in the
# repository: there is nothing to protect on a throwaway container.

name: mlcp

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mlcp-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Password_1"
      # Row-level security needs no particular edition, but Developer matches Azure SQL's
      # feature surface more closely than Express does.
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: mlcp-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: mlcp-azurite
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0"]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  # The sync pipeline is driven by Service Bus (docs/03-architecture.md §6.1), so a local
  # queue is needed to run the worker end to end rather than only under test doubles.
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: mlcp-servicebus
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sql
      MSSQL_SA_PASSWORD: "Local_Dev_Password_1"
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./infra/local/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

volumes:
  sql-data:
  azurite-data:
