# Local development dependencies for MLCP.
#
#   docker compose up -d
#
# Nothing here resembles production. In Azure these are Azure SQL, Azure Managed Redis and
# Azure Service Bus, reached over private endpoints with managed identities
# (docs/03-architecture.md §8, ADR-026). The passwords below are for local use only and are
# committed on purpose: a throwaway container has nothing to protect.
#
# Azurite is not included: no code uses local storage. Data Protection keys use the default on-disk
# key store locally, and the tenant-region directory has an in-memory implementation (ADR-021).

name: mlcp

services:
  # Application database. The Service Bus emulator also keeps its state here, in its own database.
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mlcp-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Password_1"
      # Row-level security works on any edition. Developer is closer to Azure SQL's feature set
      # than Express.
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Stands in for Azure Managed Redis. Locally there are no Entra tokens: leave
  # Mlcp:Redis:UseEntraAuth unset and use ConnectionStrings:Redis=localhost:6379.
  redis:
    image: redis:7-alpine
    container_name: mlcp-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Service Bus emulator
  # (https://learn.microsoft.com/en-us/azure/service-bus-messaging/test-locally-with-service-bus-emulator).
  # It requires SQL Server, and uses the sql service above. The emulator has no Entra support, so
  # locally both apps use ConnectionStrings:ServiceBus:
  #   Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: mlcp-servicebus
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sql
      MSSQL_SA_PASSWORD: "Local_Dev_Password_1"
    ports:
      - "5672:5672" # AMQP
      - "5300:5300" # management and health: http://localhost:5300/health
    volumes:
      - ./infra/local/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

volumes:
  sql-data:
